openapi: 3.0.3
info:
  title: PartStream Order API
  version: 1.0.0
paths:
  /orders:
    post:
      summary: Durably accept an order
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [part_id, quantity, needed_by]
                    properties:
                      part_id: {type: string}
                      quantity: {type: integer, minimum: 1}
                      needed_by: {type: string, format: date-time}
      responses:
        '202': {description: Accepted and saved before downstream processing}
        '409': {description: Idempotency key reused with another payload}
  /orders/{order_id}:
    get:
      summary: Get accepted order and current local status
      parameters:
        - {in: path, name: order_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Order found}
        '404': {description: Order not found}

