      ADMIN_TOKEN: ${SELLER_ADMIN_TOKEN:-}
    expose: ["8103"]
    healthcheck: *seller-health
    depends_on: *app-depends
    networks: [partstream]
    logging: *default-logging

  seller-4:
    profiles: [apps]
    build: *seller-build
    restart: unless-stopped
