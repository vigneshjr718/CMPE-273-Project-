services:
  order:
    build: ./services/order
    environment:
      ORDER_DATABASE_URL: postgresql+asyncpg://order:${POSTGRES_PASSWORD}@postgres:5432/order_db
      ORDER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_KAFKA_ENABLED: "true"
      ORDER_STATUS_BASE_URL: http://tracker:8004
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - kafka

