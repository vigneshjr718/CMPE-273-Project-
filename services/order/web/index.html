<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartStream</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#172033}h1{font-size:42px}form,section{padding:22px;border:1px solid #d8deea;border-radius:14px;margin:20px 0}label{display:block;margin:10px 0 4px}input,button{padding:11px;border-radius:8px;border:1px solid #aeb8c8;font-size:16px}input{width:95%}button{background:#2256d8;color:#fff;cursor:pointer;margin-top:14px}.muted{color:#65718a}#result{white-space:pre-wrap}</style></head>
<body><h1>PartStream</h1><p class="muted">Submit a repair-parts order and receive a durable tracking ID. Seller processing continues after acceptance.</p>
<form id="order"><h2>Submit sample order</h2><label>Part ID</label><input id="part" value="front-bumper" required><label>Quantity</label><input id="qty" type="number" min="1" value="1" required><label>Needed by</label><input id="date" type="datetime-local" required><button>Accept order</button></form>
<section><h2>Order lookup</h2><input id="lookup" placeholder="ord-..."><button id="find">Check status</button><div id="result"></div></section>
<script>const date=document.querySelector('#date');date.value=new Date(Date.now()+7*864e5).toISOString().slice(0,16);const out=document.querySelector('#result');document.querySelector('#order').onsubmit=async e=>{e.preventDefault();const key='web-'+crypto.randomUUID();const r=await fetch('/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({lines:[{part_id:part.value,quantity:Number(qty.value),needed_by:new Date(date.value).toISOString()}]})});out.textContent=JSON.stringify(await r.json(),null,2);};document.querySelector('#find').onclick=async()=>{const r=await fetch('/orders/'+lookup.value);out.textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
