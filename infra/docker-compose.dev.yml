# LOCAL DEVELOPMENT ONLY. Owner: D. Never use this file on the cloud VM.
# Publishes infra and API ports on 127.0.0.1 so you can run a service or tests
# on your laptop against the containerized Postgres/Kafka and open /docs pages.
# Use: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml ...
# (cloud runs omit this file).
#
# Port clash? (e.g. a local PostgreSQL already uses 5432) -> set
# POSTGRES_HOST_PORT / KAFKA_HOST_PORT in infra/.env.
# Note: Kafka advertises localhost:9092 to host clients, so if you change
# KAFKA_HOST_PORT, host clients must still be reachable at that advertised address.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
  kafka:
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9094"
  order:
    ports: ["127.0.0.1:8001:8001"]
  coordinator:
    ports: ["127.0.0.1:8002:8002"]
  tracker:
    ports: ["127.0.0.1:8004:8004"]
  seller-1:
    ports: ["127.0.0.1:8101:8101"]
  seller-2:
    ports: ["127.0.0.1:8102:8102"]
  seller-3:
    ports: ["127.0.0.1:8103:8103"]
  seller-4:
    ports: ["127.0.0.1:8104:8104"]
  seller-5:
    ports: ["127.0.0.1:8105:8105"]
